name: Release

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The page check lays pages out in the plugin's headless shell, as on a user's machine; cached by the source that pins its version.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/paseo/plugin-cache/paseo-chat-polish/chrome-headless-shell
          key: headless-shell-${{ runner.os }}-${{ hashFiles('server/headless-shell.ts') }}
      - name: Install the headless shell
        env:
          PASEO_HOME: ${{ runner.temp }}/paseo
        run: node --input-type=module -e "const shell = await import('./server/headless-shell.ts'); await shell.installHeadlessShell(); if (!shell.headlessShell()) process.exit(1);"
      - run: npm test
        env:
          PASEO_HOME: ${{ runner.temp }}/paseo
      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="v$(node -p "require('./package.json').version")"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "$RELEASE_TAG already exists; skipping release"
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --generate-notes
          fi
